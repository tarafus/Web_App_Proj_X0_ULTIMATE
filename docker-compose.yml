version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgresSQL
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: morpionBD
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: morpion-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/morpionBD
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: morpion-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
