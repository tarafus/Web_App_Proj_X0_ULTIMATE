server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache long pour les assets compilés (ils ont un hash dans le nom)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing : si l'URL ne correspond à aucun fichier, on sert index.html
    # → permet de rafraîchir /profile, /lobby, /game/42 sans 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}